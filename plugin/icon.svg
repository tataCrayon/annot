<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Annot">
  <!-- Three blocks stepping down to the right: the shape a skill reads as. -->
  <rect x="6" y="8" width="22" height="13" rx="3" fill="#6366f1"/>
  <rect x="21" y="26" width="22" height="13" rx="3" fill="#8b5cf6"/>
  <rect x="36" y="44" width="22" height="13" rx="3" fill="#a78bfa"/>
  <!-- Anchors: the lines each block came from. -->
  <g stroke="#0f172a" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="32" y1="14.5" x2="58" y2="14.5"/>
    <line x1="47" y1="32.5" x2="58" y2="32.5"/>
    <line x1="62" y1="50.5" x2="62" y2="50.5"/>
  </g>
</svg>
