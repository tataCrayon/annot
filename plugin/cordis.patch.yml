# annot-dsh bundle patch
#
# One `insert`: the Host half registers the annot routes under /api/annot/*.
# They are read-only except two: `report` (the page describing itself, loopback
# only) and the temp-directory write that `/flow` needs to draw a graph. Nothing
# here writes into the user's skill tree — `annotate` on the command line does
# that, on purpose, by a human.
#
# Notes for whoever edits this next:
#   - `dsh plugin --profile <name> add <dir>` appends this bundle to the stack
#     and the boot adds exactly this row. Do NOT also add a manual mount line
#     to the profile's cordis.patch.yml: that mounts the routes twice and fails
#     the whole plugin tree with "duplicate prefix route".
#   - the route prefix is `annot`; the client half registers into
#     `sidebar.panellist` + `main` under the same id.
#   - `clientModules` is injected optionally at apply time, not declared in
#     `inject`: a profile without a Web page must still get a working plugin.
- insert:
    - id: annot
      name: 'annot-dsh'
      # This bundle is `private: true` and installed by link from the repo it
      # lives in, so pointing at the repo's own entry point is correct here and
      # makes "the panel and the command line are the same engine" checkable.
      # A published bundle must drop this block and let `cli` default to `annot`
      # on PATH: an absolute path baked into the package points at a directory
      # that does not exist on anyone else's machine.
      config:
        cli: 'D:/Projects/flp/vibeskill/src/cli.ts'
